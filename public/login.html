<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaTeX Live</title>
<style>
  :root {
    --urucum: #F04E44;
    --chumbo: #1C2127;
    --gelo: #F0F0F0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--chumbo);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: var(--gelo);
    border-radius: 10px;
    padding: 32px 28px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    color: var(--chumbo);
    font-weight: 600;
  }
  .mark {
    width: 18px;
    height: 18px;
    background: var(--chumbo);
    clip-path: polygon(0 0, 40% 0, 40% 35%, 100% 35%, 100% 65%, 60% 65%, 60% 100%, 0 100%);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #5E5E5E;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(28, 33, 39, 0.22);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: 2px solid var(--urucum);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 6px;
    background: var(--urucum);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    filter: brightness(1.08);
  }
  .error {
    background: #fbe4e2;
    color: #9c1f16;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 16px;
    display: none;
  }
  .error.visible {
    display: block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark"></span> LaTeX Live</div>
    <div class="error" id="error">Senha incorreta. Tente novamente.</div>
    <form method="POST" action="/login">
      <label for="password">Senha de acesso</label>
      <input type="password" id="password" name="password" autofocus required />
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) {
      document.getElementById('error').classList.add('visible');
    }
  </script>
</body>
</html>
